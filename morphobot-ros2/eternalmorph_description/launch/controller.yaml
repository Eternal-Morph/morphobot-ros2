eternalmorph_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers --------------------------------------
  sol_on_ground_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sol_on_ground_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sol_on_air_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sol_on_air_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sag_on_ground_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sag_on_ground_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sag_on_air_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sag_on_air_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sol_arka_ground_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sol_arka_ground_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sol_arka_air_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sol_arka_air_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sag_arka_ground_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sag_arka_ground_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
  sag_arka_air_mode_position_controller:
    type: effort_controllers/JointPositionController
    joint: sag_arka_air_mode
    pid: {p: 100.0, i: 0.01, d: 10.0}
